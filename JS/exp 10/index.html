<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 10 - Student Information Form</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f2f6ff;
      margin: 0;
      padding: 40px 16px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 12px #b7c2d6;
    }

    h1 { color: #173f80; font-size: 25px; }
    .field { margin: 16px 0; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #8b98ac;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      background: #173f80;
      color: white;
      border: 0;
      padding: 11px 22px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .error { color: #c62828; margin-top: 18px; }
    .success { color: #147a32; margin-top: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Student Information Form</h1>

    <form id="studentForm" novalidate>
      <div class="field">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your full name">
      </div>

      <div class="field">
        <label for="address">Address:</label>
        <input type="text" id="address" placeholder="Enter your address">
      </div>

      <div class="field">
        <label for="city">City:</label>
        <input type="text" id="city" placeholder="Enter your city">
      </div>

      <div class="field">
        <label for="state">State:</label>
        <input type="text" id="state" placeholder="Enter your state">
      </div>

      <div class="field">
        <label for="gender">Gender:</label>
        <select id="gender">
          <option value="">Select</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="mobile">Mobile Number:</label>
        <input type="text" id="mobile" placeholder="Enter 10-digit mobile number">
      </div>

      <div class="field">
        <label for="email">Email ID:</label>
        <input type="email" id="email" placeholder="Enter your email address">
      </div>

      <button type="submit">Submit</button>
    </form>

    <div id="message" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
